# Morning Paper example configuration

name: Morning Paper
timezone: America/Los_Angeles
profile: |
  Add a short note about who this paper is for and what should matter most.
  Example: early-stage AI tools, operator software, media, and founder signal.
# local parses pages on this machine (URLs never leave your computer);
# jina sends each URL to the third-party r.jina.ai reader service
article_extractor: local

sources:
  hacker_news:
    enabled: true
    limit: 20
  rss:
    - name: Simon Willison
      url: https://simonwillison.net/atom/everything/
      limit: 5
    - name: Lenny's Newsletter
      url: https://www.lennysnewsletter.com/feed
      limit: 5

outputs:
  directory: ~/.local/share/morning-paper
  renderer: typewriter
  # style: editorial | typewriter | flow | magazine | ops-card | zine    palette: mono | color
  # editorial/color is what the demo prints — the default recommendation
  style: editorial
  palette: color
  pdf: true
  html: true
  markdown: true
  json: true
