name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  pretty-renderer:
    name: Pretty renderer smoke (WeasyPrint)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install native print libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils

      - name: Install native print libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pango gdk-pixbuf poppler

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pretty]"

      - name: Prove the production print path
        run: |
          morning-paper doctor --strict
          morning-paper demo
          python -m pytest tests/test_demo.py tests/test_styles.py tests/test_frontpage_visual_snapshot.py -q
          python scripts/setup_scaffold_smoke.py
          python scripts/new_user_smoke.py
          python scripts/five_edition_loop_smoke.py
          python scripts/source_shape_intake_smoke.py

  plugins:
    name: Validate plugin surface (Claude Code + Codex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node (for the Claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Claude Code plugin (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./ --strict

      - name: Validate Codex plugin + marketplace (structural)
        run: python scripts/validate_codex_plugin.py

      - name: Install-smoke (both hosts expose setup/edition/writing)
        run: python scripts/install_smoke.py
